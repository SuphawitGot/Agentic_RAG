[project]
name = "ragsale"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "pillow>=12.3.0",
    "pypdf>=6.18.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "unstructured[pdf]>=0.27.5",
    "uvicorn[standard]>=0.52.4",
    "pdfplumber>=0.11.10",
]

[project.scripts]
ragsale = "ragsale:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
